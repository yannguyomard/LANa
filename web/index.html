<!doctype html>
<html lang="fr" data-theme="lana">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LANa</title>
<style>
/* ===================== Polices (libres, licence SIL OFL 1.1, servies par LANa : jamais de CDN) ===================== */
@font-face{font-family:"Space Grotesk";src:url("/static/fonts/space-grotesk.woff2") format("woff2");font-weight:300 700;font-display:swap}
@font-face{font-family:"Inter";src:url("/static/fonts/inter.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("/static/fonts/jetbrains-mono.woff2") format("woff2");font-weight:100 800;font-display:swap}

/* ===================== Tokens de mouvement ===================== */
:root{
  --dur-1:120ms;--dur-2:220ms;--dur-3:360ms;--dur-4:600ms;
  --ease-out:cubic-bezier(.16,1,.3,1);--ease-in:cubic-bezier(.7,0,.84,0);--ease-in-out:cubic-bezier(.65,0,.35,1);
  --ease-spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121 24%,1.149 27.3%,1.159 30.7%,1.149 34.5%,1.071 45.5%,1.025 55.1%,.998 66.6%,.991 76.1%,1);
  --stagger:45ms;--cell:56px;
}
@supports not (transition-timing-function:linear(0,1)){:root{--ease-spring:var(--ease-out)}}

/* ===================== Thème LANa ===================== */
:root,:root[data-theme="lana"]{
  color-scheme:dark;
  --bg:#0e0e10;--bg-2:#121215;--surface:#16161a;--surface-2:#1c1c21;--line:#2c2c33;
  --ink:#f0f0f0;--ink-2:#c7c7c7;--mut:#9a9aa3;--faint:#80808a;
  --acc:#7c4dff;--acc-2:#d9ccff;--acc-ink:#ffffff;
  --ok:#4ff0a6;--warn:#ffb547;--bad:#ff6b6b;
  --font-display:"Space Grotesk",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-ui:"Inter",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius:10px;--radius-sm:6px;--border-w:1px;
  --glow:0 10px 40px rgba(124,77,255,.22);--scene:lana;
  --halo:radial-gradient(1200px 500px at 0% -10%,rgba(124,77,255,.10),transparent 60%);
}
@media (prefers-color-scheme:light){
  :root[data-theme="lana"]{
    color-scheme:light;
    --bg:#f6f6f7;--bg-2:#efeff1;--surface:#ffffff;--surface-2:#f4f4f6;--line:#e1e1e6;
    --ink:#111114;--ink-2:#2c2c33;--mut:#55555e;--faint:#6e6e78;
    --acc:#6236e8;--acc-2:#4b2bb8;--acc-ink:#ffffff;
    --ok:#0c7a4a;--warn:#9a5b00;--bad:#c42f2f;
    --glow:0 10px 40px rgba(98,54,232,.14);
    --halo:radial-gradient(1200px 500px at 0% -10%,rgba(98,54,232,.08),transparent 60%);
  }
}

/* ===================== Thèmes des jeux (couleurs ; décors à venir) ===================== */
:root[data-theme="enshrouded"]{color-scheme:dark;
  --bg:#0d0a12;--bg-2:#130f1a;--surface:#1a1522;--surface-2:#221b2c;--line:#3a2f48;
  --ink:#f4eefb;--ink-2:#d9cfe6;--mut:#a798b8;--faint:#6e6180;
  --acc:#ff8a3d;--acc-2:#c86bff;--acc-ink:#1a0f06;--ok:#4fe0c0;--warn:#ffc35a;--bad:#ff5d73;
  --font-display:"Cinzel",Georgia,serif;--radius:10px;--radius-sm:6px;
  --glow:0 0 24px rgba(255,138,61,.35);--scene:shroud;
  --halo:radial-gradient(900px 420px at 80% -10%,rgba(200,107,255,.16),transparent 65%),radial-gradient(700px 360px at 0% 0%,rgba(255,138,61,.08),transparent 60%)}
:root[data-theme="minecraft"]{color-scheme:dark;
  --bg:#0b1026;--bg-2:#111a3a;--surface:#1d2333;--surface-2:#262d40;--line:#3b4560;
  --ink:#f5f7fa;--ink-2:#d6dbe5;--mut:#9aa5bb;--faint:#66708a;
  --acc:#6cc04a;--acc-2:#7ec0ee;--acc-ink:#0d1a06;--ok:#6cc04a;--warn:#f2c94c;--bad:#e8574a;
  --font-display:"Pixelify Sans",ui-monospace,Menlo,monospace;--radius:0px;--radius-sm:0px;--border-w:2px;
  --glow:none;--scene:voxel;
  --halo:linear-gradient(180deg,#121b44 0,#0b1026 420px)}
:root[data-theme="vrising"]{color-scheme:dark;
  --bg:#0b0708;--bg-2:#120b0d;--surface:#1a1012;--surface-2:#241619;--line:#3d2529;
  --ink:#f3ecea;--ink-2:#d8cccb;--mut:#a8999a;--faint:#6f6062;
  --acc:#d4183c;--acc-2:#c8a24a;--acc-ink:#fff5f5;--ok:#c8a24a;--warn:#e0a63c;--bad:#ff4d5e;
  --font-display:"Cormorant SC",Georgia,serif;--radius:4px;--radius-sm:2px;
  --glow:0 0 28px rgba(212,24,60,.35);--scene:bloodmoon;
  --halo:radial-gradient(700px 380px at 85% -5%,rgba(212,24,60,.18),transparent 65%)}
:root[data-theme="palworld"]{color-scheme:light;
  --bg:#eaf6ff;--bg-2:#d7eeff;--surface:#ffffff;--surface-2:#f2f8fc;--line:#cfe0ec;
  --ink:#10283a;--ink-2:#28465c;--mut:#4f6b80;--faint:#8aa2b4;
  --acc:#0a74c2;--acc-2:#ffcc33;--acc-ink:#ffffff;--ok:#2f9e44;--warn:#b26a00;--bad:#d6334a;
  --font-display:"Fredoka",ui-rounded,-apple-system,sans-serif;--radius:18px;--radius-sm:12px;
  --glow:0 8px 24px rgba(10,116,194,.18);--scene:meadow;
  --halo:radial-gradient(900px 420px at 10% -10%,rgba(255,204,51,.35),transparent 60%)}
:root[data-theme="sotf"]{color-scheme:dark;
  --bg:#0a0e0b;--bg-2:#0f1510;--surface:#151c16;--surface-2:#1c251d;--line:#2e3a2f;
  --ink:#ece8dc;--ink-2:#d2cdbd;--mut:#9a9887;--faint:#656656;
  --acc:#d9a441;--acc-2:#6f8f5a;--acc-ink:#1a1206;--ok:#8fbf6a;--warn:#d9a441;--bad:#e0584f;
  --font-display:"Special Elite","Courier New",monospace;--radius:3px;--radius-sm:2px;
  --glow:0 0 22px rgba(217,164,65,.28);--scene:forest;
  --halo:radial-gradient(800px 400px at 50% -10%,rgba(111,143,90,.14),transparent 65%)}

/* ===================== Base ===================== */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--halo),var(--bg);background-repeat:no-repeat;color:var(--ink);
  font:15px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:20px 20px 64px}
a{color:inherit}
::selection{background:var(--acc);color:var(--acc-ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--radius-sm)}

/* en-tête */
header.top{display:flex;align-items:center;gap:14px;margin:6px 0 28px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:22px;height:22px;display:block}
.brand b{font:600 21px/1 var(--font-display);letter-spacing:-.01em}
.mono{font-family:var(--font-mono)}
.caps{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.ver{color:var(--faint);text-transform:none}
.grow{flex:1}
.ghost{background:none;border:1px solid var(--line);color:var(--mut);padding:5px 10px;border-radius:999px;font:inherit;cursor:pointer;
  transition:color var(--dur-2),border-color var(--dur-2)}
.ghost:hover{color:var(--ink);border-color:var(--mut)}
.ghost[aria-pressed="true"]{color:var(--ink);border-color:var(--acc)}

/* titres de section façon journal */
h2.lbl{display:flex;align-items:center;gap:10px;margin:0 0 14px;color:var(--mut);font-weight:400}
h2.lbl .n{color:var(--faint)}
h2.lbl::after{content:"";flex:1;height:1px;background:var(--line)}

/* cartes */
.card{background:var(--surface);border:var(--border-w) solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px}
section.block{margin-bottom:34px}

/* boutons et champs */
button.b,.b{font:500 14px/1 var(--font-ui);border:var(--border-w) solid var(--line);background:var(--surface-2);color:var(--ink);
  padding:10px 15px;border-radius:var(--radius-sm);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  transition:transform var(--dur-1) var(--ease-out),border-color var(--dur-2),background-color var(--dur-2),box-shadow var(--dur-2)}
.b:hover{border-color:var(--mut)}
.b:active{transform:scale(.97)}
.b.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.b.p:hover{box-shadow:var(--glow)}
.b.d{color:var(--bad)}
.b:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
label.chk{flex-direction:row;align-items:center;gap:9px;color:var(--ink-2);font-size:14px;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--bg-2);border:var(--border-w) solid var(--line);border-radius:var(--radius-sm);
  padding:9px 11px;width:100%;transition:border-color var(--dur-2),box-shadow var(--dur-2)}
input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc);padding:0}
.hint{font-size:12.5px;color:var(--mut)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;user-select:none;transition:all var(--dur-2)}
.tag.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.item{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;background:var(--bg-2)}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px}
.msg{font-size:13px;margin:6px 0 0}.msg.bad{color:var(--bad)}.msg.warn{color:var(--warn)}
a.back{display:inline-flex;gap:6px;color:var(--mut);text-decoration:none;margin-bottom:16px;transition:color var(--dur-2)}
a.back:hover{color:var(--ink)}

/* pastilles d'état */
.dot{position:relative;width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none;display:inline-block}
.dot.on{background:var(--ok);box-shadow:0 0 10px color-mix(in srgb,var(--ok) 60%,transparent)}
.dot.off{background:var(--faint)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.dot.live::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--ok);opacity:0;animation:ping 2.6s var(--ease-out) infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.8}70%,100%{transform:scale(1.6);opacity:0}}
.pill{display:inline-flex;align-items:center;gap:8px;padding:4px 11px 4px 9px;border:1px solid var(--line);border-radius:999px;color:var(--ink-2)}

/* ===================== Accueil ===================== */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:start;margin-bottom:38px;min-height:calc(var(--cell)*7 + 2px)}
.boot{display:flex;flex-direction:column;gap:4px;padding-top:6px}
.boot h1{font:600 clamp(28px,4.4vw,44px)/1.05 var(--font-display);letter-spacing:-.02em;margin:0 0 22px;max-width:16ch}
.boot h1 em{font-style:normal;color:var(--acc-2)}
.bl{display:grid;grid-template-columns:8ch 10ch minmax(0,1fr);gap:0 16px;font:12.5px/2.1 var(--font-mono);letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink);opacity:0;animation:blRun 1.6s var(--ease-out) forwards;animation-delay:calc(var(--i)*110ms)}
.bl .t{color:var(--faint)}
.bl .k{color:var(--mut)}
.bl .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl.last{animation:blIn var(--dur-3) var(--ease-out) forwards;animation-delay:calc(var(--i)*110ms)}
.bl.last .v{color:var(--ink)}
.bl.last .v::after{content:"";display:inline-block;width:.6em;height:1.05em;margin-left:6px;vertical-align:-.15em;background:var(--acc);animation:caret 1.1s steps(1) infinite}
@keyframes blIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* Une seule animation par ligne : deux animations de la même propriété empêchent le navigateur de les confier
   à la carte graphique (mesuré : 15 i/s au lieu de 30 pendant l'arrivée de l'accueil). */
@keyframes blRun{0%{opacity:0;transform:translateY(4px)}22%{opacity:1;transform:none}55%{opacity:1}100%{opacity:.62;transform:none}}
@keyframes caret{50%{opacity:0}}

/* grille en escalier */
.stairs{display:flex;flex-direction:column;align-items:flex-end}
.stairs .r{display:flex;justify-content:flex-end}
.cell{position:relative;width:var(--cell);height:var(--cell);border-left:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;flex:none}
.stairs .r:first-child .cell{border-top:1px solid var(--line)}
.cell.ghost-cell{border-left-color:transparent}
.cell::before{content:"";position:absolute;inset:0;background:var(--blk) center/cover no-repeat;transform:translateX(-101%);
  transition:transform .75s var(--ease-out)}
.cell.in::before,.cell.lit::before{transform:none}
.cell.out::before{transform:translateX(101%);transition:transform .5s var(--ease-in)}
.cell.reset::before{transition:none}
.cell.lit{cursor:pointer}
.cell.lit::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.cell.lit.idle::before{filter:saturate(.25) brightness(.7)}

/* listes de l'accueil */
.servers{display:grid;gap:10px}
.srv{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:16px;padding:16px 18px;text-decoration:none;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);position:relative;overflow:hidden;
  transition:transform var(--dur-2) var(--ease-out),border-color var(--dur-2)}
.srv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--g,var(--acc))}
.srv::after{content:"";position:absolute;inset:0;box-shadow:var(--glow);opacity:0;transition:opacity var(--dur-2);pointer-events:none}
.srv:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--g,var(--acc)) 55%,var(--line))}
.srv:hover::after{opacity:1}
.srv .nm{font:600 17px/1.2 var(--font-display)}
.srv .sub{color:var(--mut);margin-top:3px}
.srv .go{color:var(--mut);transition:transform var(--dur-2) var(--ease-out),color var(--dur-2)}
.srv:hover .go{transform:translateX(3px);color:var(--ink)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.game::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--g,var(--acc));opacity:.9}
.game .nm{font:600 18px/1.2 var(--font-display)}
.game .req{color:var(--mut)}
.game .foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:6px}
.tagx{font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--mut);cursor:help}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:22px;color:var(--mut);text-align:center}

/* ===================== Installation (récit façon journal) ===================== */
.install{min-height:62vh;display:flex;flex-direction:column;padding:28px}
.install h1{font:600 clamp(24px,3.4vw,34px)/1.1 var(--font-display);margin:6px 0 24px;letter-spacing:-.01em}
.journal{flex:1;display:flex;flex-direction:column;font:12.5px/1.9 var(--font-mono);max-height:56vh;overflow:auto;padding-right:6px}
.journal.live .jl:last-child .x::after{content:"";display:inline-block;width:.55em;height:1.05em;margin-left:6px;vertical-align:-.15em;background:var(--acc);animation:caret 1.1s steps(1) infinite}
.jl{display:grid;grid-template-columns:8ch minmax(0,1fr);gap:12px;color:var(--mut);animation:blIn var(--dur-3) var(--ease-out) both}
.jl .t{color:var(--faint)}
.jl .x{overflow-wrap:anywhere}
.jl:last-child{color:var(--ink)}
.status{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:18px;color:var(--ink-2)}
.spin{width:15px;height:15px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ink) 18%,transparent);border-top-color:var(--ink);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===================== Page d'un serveur ===================== */
.shead{position:relative;overflow:hidden;padding:26px 24px}
.shead::after{content:"";position:absolute;inset:0;background:var(--halo);opacity:.9;pointer-events:none}
.shead > *{position:relative;z-index:1}
.shead .kind{color:var(--mut)}
.shead h1{font:600 clamp(26px,4vw,38px)/1.1 var(--font-display);margin:6px 0 14px;letter-spacing:-.01em;overflow-wrap:anywhere}
.shead .conn{color:var(--mut);margin-top:16px}
.shead .conn b{color:var(--ink-2);font-weight:500}
pre.log{margin:0;max-height:320px;overflow:auto;font:12px/1.55 var(--font-mono);white-space:pre-wrap;word-break:break-all;color:var(--ink-2);
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px}

/* joueurs */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.tile{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;background:var(--bg-2)}
.tile b{display:block;font:600 22px/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--mut)}
.recs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.rec{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--ink-2)}
.rec b{color:var(--ink);font-weight:600}
table.pl{width:100%;border-collapse:collapse;font-size:14px}
table.pl th{text-align:left;color:var(--faint);font-weight:400;padding:8px 10px;border-bottom:1px solid var(--line)}
table.pl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.pl tr.pr{cursor:pointer;transition:background-color var(--dur-2)}
table.pl tr.pr:hover{background:var(--surface-2)}
table.pl tr.more td{background:var(--bg-2)}
.tbl{overflow-x:auto}
.bk{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}

/* toasts */
#toast{position:fixed;right:20px;bottom:20px;z-index:20;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 40px))}
#toast div{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:var(--radius-sm);padding:12px 16px;
  box-shadow:0 12px 40px rgba(0,0,0,.35);animation:toastIn var(--dur-3) var(--ease-spring) both}
#toast div.err{border-left-color:var(--bad)}
#toast div.bye{animation:toastOut var(--dur-2) var(--ease-in) both}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes toastOut{to{opacity:0;transform:translateX(16px)}}

/* ===================== Entrées et transitions ===================== */
.enter{animation:rise var(--dur-3) var(--ease-out) both;animation-delay:calc(min(var(--i,0),8) * var(--stagger))}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

/* mouvement réduit : préférence système ou interrupteur de l'interface.
   On supprime les animations au lieu de les raccourcir : un élément ne doit jamais dépendre d'une animation pour
   devenir visible (constaté : animations « 1 ms » restées en cours, lignes invisibles). */
:root[data-motion="reduced"] *,:root[data-motion="reduced"] *::before,:root[data-motion="reduced"] *::after{animation:none!important;transition:none!important}
:root[data-motion="reduced"] .bl{opacity:.62}:root[data-motion="reduced"] .bl.last{opacity:1}
@media (prefers-reduced-motion:reduce){
  :root:not([data-motion="full"]) *,:root:not([data-motion="full"]) *::before,:root:not([data-motion="full"]) *::after{animation:none!important;transition:none!important}
  :root:not([data-motion="full"]) .bl{opacity:.62}:root:not([data-motion="full"]) .bl.last{opacity:1}
}

/* ===================== Petits écrans ===================== */
@media (max-width:860px){
  .hero{grid-template-columns:1fr;min-height:0}
  .stairs{display:none}
}
@media (max-width:560px){
  main{padding:14px 16px 56px}
  .bl{grid-template-columns:9ch minmax(0,1fr)}
  .bl .t{display:none}
  .srv{grid-template-columns:auto minmax(0,1fr) auto;gap:12px}
  .srv .pill{display:none}
  #motion .st{display:none}
  .shead .acts{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
  .shead .acts .b{justify-content:center;padding:10px 8px}
  .shead{padding:20px 18px}
  .card{padding:16px}
}
</style>
</head>
<body>
<div id="scene" aria-hidden="true"></div>
<main>
<header class="top">
  <a class="brand" href="#/" aria-label="LANa, accueil">
    <svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">
      <rect width="8" height="8" rx="1.2" fill="var(--acc)"/><rect x="1" y="1" width="3" height="3" fill="var(--acc-2)"/>
      <rect x="4" y="4" width="3" height="3" fill="var(--ok)"/><rect x="4" y="1" width="3" height="1" fill="var(--acc-2)" opacity=".55"/>
      <rect x="1" y="5" width="3" height="1" fill="var(--acc-2)" opacity=".55"/>
    </svg>
    <b>LANa</b>
  </a>
  <span class="caps ver" id="ver"></span>
  <span class="grow"></span>
  <button class="ghost caps" id="motion" type="button" aria-pressed="false" title="Activer ou réduire les animations">Animations</button>
</header>
<div id="view"></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s);
const mk=(tag,props,...kids)=>{const e=Object.assign(document.createElement(tag),props||{});kids.forEach(k=>k!=null&&e.append(k));return e};
const root=document.documentElement;
let timer=null,current=null;
// Un contrat de licence n'est jamais accepté implicitement : on redemande avant de reprendre une installation.
const askEula=e=>!e||confirm(`${e.label}\n${e.url}\n\nAvez-vous lu ce contrat et l'acceptez-vous ?`);

// Couleur signature de chaque jeu (bandes, cases de la grille) : les accents de leurs thèmes.
const GAME_COLORS={enshrouded:"#ff8a3d",minecraft:"#6cc04a",vrising:"#d4183c",palworld:"#2e9be6",sotf:"#d9a441",
  cs2:"#de9b35",cs16:"#c7a95b",css:"#e0a040",tf2:"#cf6a32",l4d2:"#b8322a",gmod:"#1194f0",ark:"#4fa3a5",ark_sa:"#58b7c0",
  rust:"#ce422b",projectzomboid:"#a12b2b",valheim:"#6f8fb3",unturned:"#5aa02c",sevendays:"#d35400",
  darkandlight:"#7b5ea7",vein:"#9aa0a6",quakelive:"#c0392b",minecraft_bedrock:"#52a535",ragemp:"#3aa0ff",openmp:"#e8a33d",mta:"#e2a400"};

// Dépôt de l'archive des fichiers serveur (jeux non téléchargeables automatiquement, ex. RAGE MP).
function uploadServerFiles(id,help,eula,done){
  const file=mk("input",{type:"file",accept:".zip,.tar,.gz,.tgz,.xz"});
  const b=btn("Installer depuis l'archive","p");
  b.onclick=async()=>{
    const f=file.files[0];if(!f){toast("Choisissez d'abord l'archive des fichiers serveur",true);return}
    if(!askEula(eula))return;
    b.disabled=true;toast("Envoi et installation en cours…");
    try{const r=await(await fetch(`/api/instances/${id}/server-files`,{method:"POST",headers:{"X-LANa":"1","X-Filename":encodeURIComponent(f.name),"X-Accept-Eula":eula?"1":"0"},body:f})).json();
      toast(r.message,!r.ok);if(r.ok)done()}catch(e){toast("Erreur réseau",true)}
    b.disabled=false;
  };
  return mk("div",{},mk("div",{className:"hint",style:"margin:10px 0",textContent:help}),mk("div",{className:"row"},file,b));
}
const gameColor=id=>GAME_COLORS[id]||"var(--acc)";

// ---------- mouvement ----------
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const systemReduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const reduced=()=>root.dataset.motion==="reduced"||(root.dataset.motion!=="full"&&systemReduced());
function applyMotion(){
  const pref=store.get("lana-motion");   // "reduced", "full" ou rien (= préférence du système)
  if(pref)root.dataset.motion=pref;else delete root.dataset.motion;
  const b=$("#motion");b.setAttribute("aria-pressed",String(!reduced()));
  b.replaceChildren("Animations",mk("span",{className:"st",textContent:reduced()?" : réduites":" : actives"}));
  b.setAttribute("aria-label",reduced()?"Animations réduites (activer)":"Animations actives (réduire)");
}
$("#motion").onclick=()=>{store.set("lana-motion",reduced()?"full":"reduced");applyMotion();mountScene()};
applyMotion();

// Change de vue une fois les données chargées. `nav` : numéro de la navigation qui demande l'affichage ;
// si une autre a commencé depuis, on n'affiche rien.
// Pas de View Transitions : mesuré sur le Mac Intel visé, elles coûtent un tiers des images pendant le changement
// de page ; les entrées en cascade des premiers éléments suffisent à rendre la navigation vivante.
let routing=0;
function swap(render,nav){
  if(nav!==routing)return Promise.resolve();
  render();window.scrollTo(0,0);return Promise.resolve();
}
function setTheme(name){root.dataset.theme=name}
// Animation d'entrée, réservée aux éléments visibles en haut de page : animer un bloc haut de plusieurs écrans
// oblige le navigateur à le dessiner en entier d'un coup (mesuré : la fluidité est divisée par deux).
const enter=(el,i)=>{if(!reduced()&&i<4){el.classList.add("enter");el.style.setProperty("--i",i)}return el};

// Chiffre qui défile jusqu'à sa valeur (première apparition seulement).
function countUp(el,to,fmt=n=>Math.round(n).toLocaleString("fr-FR")){
  if(reduced()||typeof to!=="number"||!isFinite(to)||to<=0){el.textContent=typeof to==="number"?fmt(to):to;return}
  const t0=performance.now(),D=700;
  const step=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

// ---------- décor ----------
// Le décor dépend du thème (token --scene). LANa : rien de fixe, la grille vit dans l'accueil. Les jeux auront le leur.
function mountScene(){
  const name=getComputedStyle(root).getPropertyValue("--scene").trim();
  const scene=$("#scene");
  if(scene.dataset.name===name)return;
  scene.dataset.name=name;scene.innerHTML="";
}

// Motifs 8×8 des cases de la grille : des « paquets » réseau dessinés pour LANa.
const PATTERNS=[
  ["aaaa....","........","aaaa....","....aaaa","....aaaa","........","bbbbbbbb","........"],
  ["........",".aa..aa.",".aa..aa.","........","aaaaaaaa","aaaaaaaa","..aaaa..","...bb..."],
  ["a.......","aa......",".aa.....","..aa....","...aa...","....aa..",".....bb.","......bb"],
  ["aaaaaaaa","a......a","a.bbbb.a","a.b..b.a","a.b..b.a","a.bbbb.a","a......a","aaaaaaaa"],
  ["....aaaa","....aaaa","....aaaa","....aaaa","cc......","cc......","aaaa....","aaaa...."],
  ["a.a.a.a.",".a.a.a.a","a.a.a.a.","........","bbbb....","bbbb....","........","aaaaaaaa"],
];
function blockURI(i,bg){
  const css=getComputedStyle(root),col={a:css.getPropertyValue("--acc-2").trim()||"#d9ccff",b:css.getPropertyValue("--ok").trim()||"#4ff0a6",c:css.getPropertyValue("--bad").trim()||"#ff6b6b"};
  let r="";
  PATTERNS[i%PATTERNS.length].forEach((line,y)=>[...line].forEach((ch,x)=>{if(col[ch])r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${col[ch]}"/>`}));
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" shape-rendering="crispEdges"><rect width="8" height="8" fill="${bg}"/>${r}</svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
const ROWS=[6,6,5,4,4,3,2],GHOSTS=["0-0","2-0","4-0"];
function stairs(servers){
  const wrap=mk("div",{className:"stairs","aria-hidden":"true"});
  const acc=getComputedStyle(root).getPropertyValue("--acc").trim();
  const hover=!reduced()&&matchMedia("(hover: hover)").matches;
  const cells=[];
  ROWS.forEach((n,r)=>{const row=mk("div",{className:"r"});for(let c=0;c<n;c++){
    const cell=mk("div",{className:"cell"});row.append(cell);
    if(GHOSTS.includes(r+"-"+c)){cell.classList.add("ghost-cell");continue}
    cell.style.setProperty("--blk",blockURI(r*7+c*3,acc));cells.push(cell);
    if(hover){
      cell.onmouseenter=()=>{if(cell.classList.contains("lit"))return;cell.classList.remove("out","reset");cell.classList.add("in")};
      cell.onmouseleave=()=>{if(cell.classList.contains("lit"))return;cell.classList.replace("in","out");
        setTimeout(()=>{if(cell.classList.contains("out")){cell.classList.add("reset");cell.classList.remove("out");void cell.offsetWidth;cell.classList.remove("reset")}},520)};
    }
  }wrap.append(row)});
  // Chaque serveur installé allume une case, à la couleur de son jeu (en veille s'il est arrêté).
  const slots=[cells[cells.length-1],cells[cells.length-4],cells[cells.length-8],cells[5],cells[12],cells[2],cells[19],cells[9]].filter(Boolean);
  servers.filter(s=>s.installed).slice(0,slots.length).forEach((s,i)=>{
    const cell=slots[i];cell.style.setProperty("--blk",blockURI(i+1,GAME_COLORS[s.game]||acc));
    cell.classList.add("lit");if(!s.running)cell.classList.add("idle");
    cell.title=`${s.name} — ${s.running?"en marche":"arrêté"}`;cell.onclick=()=>location.hash="#/s/"+s.id;
    cell.style.pointerEvents="auto";
  });
  return wrap;
}

// ---------- utilitaires ----------
async function api(path,body){
  const opts=body===undefined?{}:{method:"POST",headers:{"X-LANa":"1","Content-Type":"application/json"},body:JSON.stringify(body)};
  const r=await fetch(path,opts);
  const ct=r.headers.get("content-type")||"";
  return ct.includes("json")?r.json():r.text();
}
function toast(text,err){
  const t=$("#toast"),d=mk("div",{textContent:text,className:err?"err":""});t.append(d);
  while(t.children.length>3)t.firstChild.remove();
  setTimeout(()=>{d.classList.add("bye");setTimeout(()=>d.remove(),reduced()?0:240)},err?9000:5000);
}
async function act(btns,path,body,after){
  btns.forEach(b=>b.disabled=true);
  try{const r=await api(path,body||{});toast(r.message||(r.ok?"Fait":"Erreur"),!r.ok);if(r.ok&&after)after(r)}
  catch(e){toast("Erreur réseau",true)}
  btns.forEach(b=>b.disabled=false);
}
const btn=(text,cls,props)=>mk("button",Object.assign({type:"button",className:"b"+(cls?" "+cls:""),textContent:text},props||{}));
const label=(n,text)=>mk("h2",{className:"lbl caps"},mk("span",{className:"n",textContent:String(n).padStart(2,"0")}),text);
const clock=d=>(d||new Date()).toTimeString().slice(0,8);
const shortCpu=c=>(c||"").replace(/\((R|TM)\)/g,"").replace(/\s*CPU\s*@.*$/,"").replace(/\s+/g," ").trim();

// ---------- accueil ----------
async function home(){
  const nav=routing;
  const [m,g,list]=await Promise.all([api("/api/machine"),api("/api/games"),api("/api/instances")]);
  await swap(()=>{
    setTheme("lana");mountScene();
    const v=$("#view");v.innerHTML="";
    const running=list.filter(s=>s.running).length,installed=list.filter(s=>s.installed).length;

    // récit de démarrage
    const lines=[
      ["Machine",`${shortCpu(m.cpu)||m.arch} · ${m.ram_gb??"?"} Go de RAM`],
      ["Système",m.os||"—"],
      ["Disque",`${m.disk_free_gb} Go libres`],
      ...Object.entries(m.tools).map(([k,p])=>[k,p?"installé":k==="java"?"téléchargé à la demande":"absent"]),
      ["Réseau",m.lan_ip||"adresse locale inconnue"],
      ["Serveurs",!list.length?"aucun — choisissez un jeu ci-dessous":`${running} en marche sur ${list.length}`],
    ];
    const t0=new Date();
    const boot=mk("div",{className:"boot"},mk("h1",{},"Vos serveurs de jeu, ",mk("em",{textContent:"sur le réseau local, et au-delà."})));
    lines.forEach(([k,val],i)=>{
      const l=mk("div",{className:"bl"+(i===lines.length-1?" last":"")},mk("span",{className:"t",textContent:clock(new Date(t0.getTime()+i*1000))}),
        mk("span",{className:"k",textContent:k}),mk("span",{className:"v",textContent:val}));
      l.style.setProperty("--i",i);boot.append(l);
    });
    v.append(mk("div",{className:"hero"},boot,stairs(list)));

    // serveurs
    const sv=mk("section",{className:"block"},label(1,"Mes serveurs"));
    if(!list.length)sv.append(mk("div",{className:"empty",textContent:"Aucun serveur installé pour l'instant. Choisissez un jeu ci-dessous."}));
    const box=mk("div",{className:"servers"});
    list.forEach((s,i)=>{
      const state=!s.installed?"warn":s.running?"on":"off";
      const game=g.find(x=>x.id===s.game);
      const a=mk("a",{className:"srv",href:"#/s/"+s.id},
        mk("span",{className:"dot "+state}),
        mk("div",{},mk("div",{className:"nm",textContent:s.name}),mk("div",{className:"sub caps",textContent:game?game.name:s.game})),
        mk("span",{className:"pill caps"},!s.installed?"installation incomplète":s.running?"en marche":"arrêté"),
        mk("span",{className:"go caps",textContent:"Gérer →"}));
      a.style.setProperty("--g",gameColor(s.game));box.append(enter(a,i));
    });
    sv.append(box);v.append(sv);

    // catalogue
    const cat=mk("section",{className:"block"},label(2,"Installer un jeu"));
    const search=mk("input",{type:"search",placeholder:`Rechercher parmi ${g.length} jeux…`,style:"max-width:360px;margin-bottom:14px","aria-label":"Rechercher un jeu"});
    const grid=mk("div",{className:"games"});
    search.oninput=()=>{const q=search.value.trim().toLowerCase();[...grid.children].forEach(c=>c.hidden=!!q&&!c.dataset.name.includes(q))};
    g.forEach((game,i)=>{
      const lvl=game.verdict.level;
      const b=btn("Installer","p",{disabled:lvl==="bad"||!!game.eula});
      b.onclick=()=>{if(lvl==="warn"&&!confirm(game.verdict.messages.join("\n")+"\n\nInstaller quand même ?"))return;
        act([b],"/api/instances",{game:game.id,accept_eula:!!game.eula},r=>location.hash=r.job?"#/install/"+r.job+"/"+r.id:"#/s/"+r.id)};
      const card=mk("div",{className:"game"},
        mk("div",{className:"row"},mk("span",{className:"dot "+(lvl==="ok"?"on":lvl==="warn"?"warn":"bad")}),mk("span",{className:"nm",textContent:game.name}),
          mk("span",{className:"grow"}),
          game.untested?mk("span",{className:"tagx caps",textContent:"à tester",title:"Définition écrite d'après la documentation officielle et les données Steam, pas encore essayée en conditions réelles."}):null,
          game.wine?mk("span",{className:"tagx caps",textContent:"Wine",title:"Serveur Windows : sur cette machine, il tourne sous Wine. Compatibilité non garantie."}):null),
        mk("div",{className:"req caps",textContent:`RAM ${game.requirements.ram_gb_min}–${game.requirements.ram_gb_recommended} Go · ${game.requirements.disk_gb} Go disque`}));
      game.verdict.messages.forEach(t=>card.append(mk("div",{className:"msg "+(lvl==="bad"?"bad":lvl==="warn"?"warn":""),textContent:t})));
      if(game.eula)card.append(mk("label",{className:"chk"},
        mk("input",{type:"checkbox",onchange:e=>b.disabled=lvl==="bad"||!e.target.checked}),
        mk("span",{},"J'ai lu et j'accepte le ",mk("a",{href:game.eula.url,target:"_blank",rel:"noopener",textContent:game.eula.label}))));
      if(game.install_type==="upload")card.append(mk("div",{className:"hint",textContent:"Installation par dépôt d'une archive des fichiers serveur (expliqué à l'étape suivante)."}));
      card.append(mk("div",{className:"foot"},b));
      card.dataset.name=game.name.toLowerCase()+" "+game.id;
      card.style.setProperty("--g",gameColor(game.id));grid.append(card);
    });
    cat.append(search,grid);v.append(cat);
  },nav);
}

// ---------- installation ----------
async function installView(jobId,instId){
  const nav=routing;
  const journal=mk("div",{className:"journal",role:"log"}),stamps=[];
  const head=mk("h1",{textContent:"Installation"});
  const done=btn("Ouvrir le serveur","p",{hidden:true,onclick:()=>location.hash="#/s/"+instId});
  const retry=btn("Réessayer","",{hidden:true,onclick:async()=>{
    const e=(await api("/api/instances/"+instId)).eula;if(!askEula(e))return;
    act([retry],`/api/instances/${instId}/install`,{accept_eula:!!e},r=>location.hash="#/install/"+r.job+"/"+instId)}});
  const spin=mk("span",{className:"spin"}),stText=mk("span",{className:"caps",textContent:"Installation en cours"});
  await swap(()=>{
    setTheme("lana");mountScene();
    const v=$("#view");v.innerHTML="";
    v.append(mk("a",{className:"back caps",href:"#/",textContent:"← Accueil"}),
      mk("section",{className:"card install"},mk("div",{className:"caps",style:"color:var(--mut)",textContent:"Installation · journal en direct"}),head,journal,
        mk("div",{className:"status"},mk("span",{className:"grow row"},done,retry),spin,stText)));
  },nav);
  if(nav!==routing)return;
  async function poll(){
    const j=await api("/api/jobs/"+jobId);
    if(!j||!Array.isArray(j.lines)){   // tâche inconnue : LANa a redémarré depuis, son suivi est perdu
      spin.hidden=true;stText.textContent="Suivi indisponible";stText.style.color="var(--warn)";
      journal.append(mk("div",{className:"jl"},mk("span",{className:"t",textContent:clock()}),
        mk("span",{className:"x",textContent:"Le suivi de cette installation n'existe plus (LANa a probablement redémarré). Ouvrez le serveur pour voir où il en est."})));
      done.hidden=false;return;
    }
    head.textContent=j.title||"Installation";journal.classList.toggle("live",j.state==="running");
    const atEnd=journal.scrollTop+journal.clientHeight>=journal.scrollHeight-30;
    for(let i=journal.children.length;i<j.lines.length;i++){
      stamps[i]=stamps[i]||clock();
      journal.append(mk("div",{className:"jl"},mk("span",{className:"t",textContent:stamps[i]}),mk("span",{className:"x",textContent:j.lines[i]})));
    }
    while(journal.children.length>400)journal.firstChild.remove();
    if(atEnd)journal.scrollTop=journal.scrollHeight;
    const st=j.state;
    spin.hidden=st!=="running";
    stText.textContent=st==="running"?"Installation en cours":st==="done"?"Terminé":"Échec de l'installation";
    stText.style.color=st==="error"?"var(--bad)":st==="done"?"var(--ok)":"";
    done.hidden=st!=="done";retry.hidden=st!=="error";
    if(st==="running")timer=setTimeout(poll,1500);
  }
  poll();
}

// ---------- page d'un serveur : champs ----------
function fieldInput(f,val){
  const t=f.type;
  if(t==="bool"){const i=mk("input",{type:"checkbox",checked:!!val});i.get=()=>i.checked;return{el:mk("label",{className:"chk"},i,f.label),get:i.get}}
  let i;
  if(t==="enum"){i=mk("select");f.options.forEach(o=>i.append(mk("option",{value:o,textContent:(f.labels&&f.labels[o])||o,selected:o===val})));i.get=()=>i.value}
  else if(t==="text"){i=mk("input",{value:val??"",maxLength:f.maxlen||200});i.get=()=>i.value}
  else{i=mk("input",{type:"number",step:"any",min:f.min,max:f.max,value:val});i.get=()=>i.value===""?null:+i.value}
  const l=mk("label",{},f.label,i);if(f.hint)l.append(mk("span",{className:"hint",textContent:f.hint}));
  return{el:l,get:i.get};
}
function tagsInput(f,val){
  const box=mk("div",{className:"tags"});
  f.options.forEach(o=>box.append(mk("span",{className:"tag"+(val.includes(o)?" on":""),textContent:o,tabIndex:0,
    onclick:e=>e.target.classList.toggle("on"),onkeydown:e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();e.target.classList.toggle("on")}}})));
  return{el:mk("div",{},mk("div",{className:"hint",style:"margin:10px 0 8px",textContent:f.label}),box),get:()=>[...box.querySelectorAll(".on")].map(e=>e.textContent)};
}
function collectionInput(f,val){
  const box=mk("div"),rows=[];
  const add=item=>{
    const card=mk("div",{className:"item"}),grid=mk("div",{className:"grid"}),checks=mk("div",{className:"checks"}),getters={};
    f.item.forEach(sub=>{const inp=fieldInput(sub,item[sub.key]);getters[sub.key]=inp.get;(sub.type==="bool"?checks:grid).append(inp.el)});
    const row={getters,card};rows.push(row);
    card.append(grid,checks,btn("Supprimer","d",{style:"margin-top:12px",onclick:()=>{rows.splice(rows.indexOf(row),1);card.remove()}}));
    box.append(card);
  };
  val.forEach(add);
  const defaults=()=>Object.fromEntries(f.item.map(s=>[s.key,s.key==="password"?Math.random().toString(36).slice(2,12):s.default]));
  return{el:mk("div",{},mk("div",{className:"hint",style:"margin-bottom:10px",textContent:f.hint||""}),box,btn("Ajouter","",{onclick:()=>add(defaults())})),
    get:()=>rows.map(r=>Object.fromEntries(Object.entries(r.getters).map(([k,g])=>[k,g()])))};
}

// ---------- joueurs ----------
const dur=sec=>{sec=Math.round(sec||0);if(sec<60)return sec+" s";const m=Math.floor(sec/60);if(m<60)return m+" min";
  const h=Math.floor(m/60);return h<48?`${h} h ${String(m%60).padStart(2,"0")}`:`${Math.floor(h/24)} j ${h%24} h`};
const when=t=>{if(!t)return "—";const d=new Date(t*1000),n=new Date(),same=d.toDateString()===n.toDateString();
  const hm=d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  return same?"aujourd'hui "+hm:d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+" "+hm};
const statText=s=>s.unit==="s"?dur(s.value):s.unit==="km"?s.value.toFixed(1)+" km":Math.round(s.value).toLocaleString("fr-FR");
function playersCard(tracking,n){
  const card=mk("section",{className:"block"},label(n,"Joueurs")),body=mk("div",{className:"card"});card.append(body);
  if(!tracking){body.append(mk("div",{className:"hint",textContent:"Le suivi des joueurs n'est pas encore disponible pour ce jeu : son format de journal n'a pas pu être vérifié."}));return {card,update(){}}}
  const open=new Set();let first=true;
  function update(d){
    body.innerHTML="";
    if(!d)return;
    const t=d.totals,animate=first;first=false;
    if(!tracking.verified&&tracking.note)body.append(mk("div",{className:"msg warn",style:"margin:0 0 12px",textContent:tracking.note}));
    const tile=(v,l,i)=>{const b=mk("b");animate&&typeof v==="number"?countUp(b,v):b.textContent=v;const el=mk("div",{className:"tile"},b,mk("span",{textContent:l}));return animate?enter(el,i):el};
    body.append(mk("div",{className:"tiles"},tile(t.online,"en ligne",0),tile(t.unique,"joueurs différents",1),tile(dur(t.seconds),"temps de jeu cumulé",2),
      tile(t.sessions,"sessions",3),tile(t.sessions?dur(t.average_session):"—","session moyenne",4),
      tile(t.peak||"—",t.peak?`pic de joueurs, ${when(t.peak_at)}`:"pic de joueurs",5)));
    const recs=[...(d.records||[])];
    if(t.longest_session)recs.push({label:"Plus longue session",name:t.longest_session.name,value:t.longest_session.seconds,unit:"s"});
    if(recs.length)body.append(mk("div",{className:"recs"},...recs.map(r=>mk("span",{className:"rec"},`${r.label} : `,mk("b",{textContent:r.name}),` (${statText(r)})`))));
    if(!d.players.length){body.append(mk("div",{className:"empty",textContent:"Aucun joueur vu pour l'instant. Les connexions sont lues dans le journal du serveur."}));return}
    const rows=d.players.flatMap(p=>{
      const toggle=()=>{open.has(p.name)?open.delete(p.name):open.add(p.name);update(d)};
      const tr=mk("tr",{className:"pr",tabIndex:0,onclick:toggle,onkeydown:e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}}},
        mk("td",{},mk("span",{className:"dot "+(p.online?"on":""),style:"margin-right:10px"}),mk("strong",{textContent:p.name})),
        mk("td",{className:"hint",textContent:p.online?"en ligne depuis "+dur(Date.now()/1000-p.online_since):p.last_seen?"vu "+when(p.last_seen):"avant LANa"}),
        mk("td",{textContent:dur(p.seconds)}),mk("td",{textContent:p.sessions||"—"}));
      tr.setAttribute("aria-expanded",String(open.has(p.name)));
      const out=[tr];
      if(open.has(p.name)){
        const det=[["Première connexion",when(p.first_seen)],["Dernière session",p.online?"en cours":when(p.last_seen)],["Plus longue session",dur(p.longest)],
          ...(p.id?[["Identifiant",p.id]]:[]),...((p.stats||[]).map(s=>[s.label,statText(s)]))];
        out.push(mk("tr",{className:"more"},mk("td",{colSpan:4},mk("div",{className:"tiles",style:"margin:4px 0"},...det.map(([l,v])=>mk("div",{className:"tile"},mk("b",{textContent:v,style:"font-size:16px"}),mk("span",{textContent:l})))))));
      }
      return out;
    });
    body.append(mk("div",{className:"tbl"},mk("table",{className:"pl"},
      mk("thead",{},mk("tr",{},...["Joueur","Statut","Temps de jeu","Sessions"].map(h=>mk("th",{className:"caps",textContent:h})))),mk("tbody",{},...rows))));
    if(d.events.length)body.append(mk("div",{className:"hint",style:"margin-top:14px",textContent:"Derniers événements : "+
      d.events.slice(0,6).map(e=>`${e.name} ${e.kind==="join"?"connecté":e.kind==="stop"?"déconnecté (arrêt du serveur)":"parti"} ${when(e.t)}`).join(" · ")}));
  }
  return {card,update};
}

// ---------- page d'un serveur ----------
async function serverView(id){
  const nav=routing;
  const s=await api("/api/instances/"+id);
  if(s.ok===false){toast(s.message,true);location.hash="#/";return}
  const games=await api("/api/games").catch(()=>[]);
  const gameName=(games.find(g=>g.id===s.game)||{}).name||s.game;
  if(nav!==routing)return;
  current=id;
  if(!s.installed){
    const resume=s.install_type==="upload"?uploadServerFiles(id,s.install_help,s.eula,()=>route()):
      btn("Reprendre l'installation","p",{style:"margin-top:14px",onclick:e=>{
        if(!askEula(s.eula))return;
        act([e.currentTarget],`/api/instances/${id}/install`,{accept_eula:!!s.eula},r=>location.hash="#/install/"+r.job+"/"+id)}});
    await swap(()=>{setTheme(s.game);mountScene();const v=$("#view");v.innerHTML="";
      v.append(mk("a",{className:"back caps",href:"#/",textContent:"← Accueil"}),mk("section",{className:"card shead"},
        mk("div",{className:"kind caps",textContent:gameName}),mk("h1",{textContent:s.name}),
        mk("div",{className:"hint",textContent:s.install_type==="upload"?"Ce serveur s'installe à partir de ses fichiers, que vous fournissez.":"L'installation de ce serveur n'est pas terminée."}),
        resume),
        btn("Supprimer ce serveur","d",{style:"margin-top:4px",onclick:e=>confirm("Supprimer ce serveur ?")&&act([e.currentTarget],`/api/instances/${id}/delete`,{},()=>location.hash="#/")}))},nav);
    return;
  }
  // en-tête : état + actions
  const dot=mk("span",{className:"dot"}),st=mk("span",{className:"caps"});
  const bStart=btn("Démarrer","p"),bStop=btn("Arrêter","d"),bRe=btn("Redémarrer");
  const all=[bStart,bStop,bRe];
  bStart.onclick=()=>act(all,`/api/instances/${id}/start`,{},refresh);
  bStop.onclick=()=>confirm("Arrêter le serveur ? Les joueurs seront déconnectés.")&&act(all,`/api/instances/${id}/stop`,{},refresh);
  bRe.onclick=()=>confirm("Redémarrer le serveur ?")&&act(all,`/api/instances/${id}/restart`,{},refresh);
  const head=mk("section",{className:"card shead"},
    mk("div",{className:"kind caps",textContent:gameName+" · serveur"}),mk("h1",{textContent:s.name}),
    mk("div",{className:"row"},mk("span",{className:"pill"},dot,st),mk("span",{className:"grow"}),mk("div",{className:"acts row"},...all)),
    mk("div",{className:"conn caps"},"Connexion ",mk("b",{textContent:s.connect}),"  ·  ports à ouvrir sur la box ",
      mk("b",{textContent:s.ports.map(p=>`${p.port}/${p.proto.toUpperCase()}`).join(", ")||"—"})));
  let n=1;
  const pc=playersCard(s.players_tracking,n++);

  // paramètres, groupés
  const getters={},groups={};
  s.fields.forEach(f=>(groups[f.group]??=[]).push(f));
  const settings=mk("section",{className:"block"},label(n++,"Réglages"));
  for(const [g,fs] of Object.entries(groups)){
    const card=mk("div",{className:"card"},mk("div",{className:"caps",style:"color:var(--mut);margin-bottom:14px",textContent:g}));
    const grid=mk("div",{className:"grid"}),extra=mk("div");
    fs.forEach(f=>{
      const val=s.values[f.key];
      if(f.type==="collection"){const c=collectionInput(f,val);getters[f.key]=c.get;extra.append(c.el);return}
      if(f.type==="tags"){const t=tagsInput(f,val);getters[f.key]=t.get;extra.append(t.el);return}
      const i=fieldInput(f,val);getters[f.key]=i.get;grid.append(i.el);
    });
    card.append(grid,extra);settings.append(card);
  }
  const collect=()=>Object.fromEntries(Object.entries(getters).map(([k,g])=>[k,g()]));
  const bSave=btn("Enregistrer","p",{onclick:()=>act([bSave,bSaveR],`/api/instances/${id}/config`,{values:collect()})});
  const bSaveR=btn("Enregistrer et redémarrer","",{onclick:()=>confirm("Enregistrer puis redémarrer ?")&&act([bSave,bSaveR],`/api/instances/${id}/config`,{values:collect(),restart:true},refresh)});
  settings.append(mk("div",{className:"row"},bSave,bSaveR));

  // sauvegardes
  const bk=mk("section",{className:"block"},label(n++,"Sauvegardes"));const bkc=mk("div",{className:"card"});bk.append(bkc);
  const bBack=btn("Sauvegarder maintenant","",{onclick:()=>act([bBack],`/api/instances/${id}/backup`,{},()=>route())});
  const download=name=>{const a=mk("a",{href:`/api/instances/${id}/backups/${encodeURIComponent(name)}`,download:name});document.body.append(a);a.click();a.remove()};
  const bExport=btn("Exporter la sauvegarde actuelle","",{onclick:()=>act([bExport],`/api/instances/${id}/backup`,{label:"export"},r=>{download(r.name);route()})});
  bkc.append(mk("div",{className:"hint",style:"margin-bottom:12px",textContent:"Une sauvegarde est faite automatiquement à chaque arrêt. Les 10 dernières sont gardées. Pour un export fiable, arrêtez d'abord le serveur."}),
    mk("div",{className:"row"},bBack,bExport));
  const fmts=s.import_formats.map(f=>`${f.label} : ${f.extensions.join(", ")}`).join(" · ");
  const file=mk("input",{type:"file",style:"max-width:340px"});
  const bImp=btn("Importer","",{disabled:s.running,onclick:async()=>{
    const f=file.files[0];if(!f){toast("Choisissez d'abord un fichier",true);return}
    if(!confirm(`Importer « ${f.name} » ? La sauvegarde actuelle sera d'abord archivée.`))return;
    bImp.disabled=true;toast("Envoi en cours…");
    try{const r=await(await fetch(`/api/instances/${id}/import`,{method:"POST",headers:{"X-LANa":"1","X-Filename":encodeURIComponent(f.name)},body:f})).json();
      toast(r.message,!r.ok);if(r.ok)route()}catch(e){toast("Erreur réseau",true)}
    bImp.disabled=s.running}});
  bkc.append(mk("div",{className:"hint",style:"margin:18px 0 8px",textContent:"Importer une sauvegarde (serveur arrêté) — "+fmts}),mk("div",{className:"row"},file,bImp));
  s.backups.forEach(b=>{
    const r=btn("Restaurer","",{onclick:()=>confirm("Restaurer "+b.name+" ? La sauvegarde actuelle sera d'abord archivée.")&&act([r],`/api/instances/${id}/restore`,{name:b.name},()=>route())});
    const d=btn("Télécharger","",{onclick:()=>download(b.name)});
    bkc.append(mk("div",{className:"bk"},mk("span",{className:"mono",style:"font-size:13px;overflow-wrap:anywhere",textContent:b.name}),mk("span",{className:"hint",textContent:b.size_mb+" Mo"}),mk("span",{className:"grow"}),d,r));
  });

  const logc=mk("section",{className:"block"},label(n++,"Journal")),log=mk("pre",{className:"log"});logc.append(log);
  const del=btn("Supprimer ce serveur","d",{onclick:()=>prompt("Cela supprime le serveur ET ses sauvegardes. Tapez « supprimer » pour confirmer.")==="supprimer"&&act([del],`/api/instances/${id}/delete`,{},()=>location.hash="#/")});

  await swap(()=>{
    setTheme(s.game);mountScene();
    const v=$("#view");v.innerHTML="";
    v.append(mk("a",{className:"back caps",href:"#/",textContent:"← Accueil"}),enter(head,0),enter(pc.card,1),settings,bk,logc,del);
  },nav);
  if(nav!==routing)return;

  async function refresh(){
    if(current!==id)return;
    const x=await api("/api/instances/"+id);
    dot.className="dot "+(x.running?"on live":"off");st.textContent=x.running?"En marche":"Arrêté";
    bStart.disabled=x.running;bStop.disabled=!x.running;
    if(s.players_tracking){const d=await api(`/api/instances/${id}/players`);if(current===id)pc.update(d.ok===false?null:d)}
    const atEnd=log.scrollTop+log.clientHeight>=log.scrollHeight-20;
    log.textContent=await api(`/api/instances/${id}/log`);if(atEnd)log.scrollTop=log.scrollHeight;
  }
  refresh();
  const loop=()=>{timer=setTimeout(async()=>{if(!document.hidden)await refresh();if(current===id)loop()},4000)};loop();
}

// ---------- routage ----------
async function route(){
  clearTimeout(timer);current=null;
  const mine=++routing;   // une navigation plus récente annule l'affichage d'une plus ancienne
  const h=location.hash.replace(/^#\/?/,"").split("/");
  try{
    if(h[0]==="s")await serverView(h[1]);
    else if(h[0]==="install")await installView(h[1],h[2]);
    else await home();
  }catch(e){if(mine===routing)toast("Erreur : "+e.message,true)}
}
addEventListener("hashchange",route);route();
api("/api/machine").then(m=>{$("#ver").textContent="v"+m.version}).catch(()=>{});
</script>
</body>
</html>
