<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- LANa : manette traversée d'un éclair, fusée qui décolle, traînées de vitesse. Dégradé bleu -> vert. -->
  <defs>
    <linearGradient id="body" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1b6bfa"/>
      <stop offset="0.45" stop-color="#22b8f0"/>
      <stop offset="1" stop-color="#43e923"/>
    </linearGradient>
    <linearGradient id="rocket" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1b6bfa"/>
      <stop offset="0.6" stop-color="#22b8f0"/>
      <stop offset="1" stop-color="#7cf0c8"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8ff5a"/>
      <stop offset="1" stop-color="#43e923"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1b6bfa"/>
      <stop offset="1" stop-color="#43e923"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ff5a"/>
      <stop offset="1" stop-color="#43e923" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- traînées de vitesse autour du logo -->
  <g fill="none" stroke="url(#trail)" stroke-linecap="round">
    <path d="M40 150 A92 92 0 0 1 150 44" stroke-width="7"/>
    <path d="M58 132 A74 74 0 0 1 120 66" stroke-width="4" stroke-dasharray="14 9" opacity=".8"/>
    <path d="M206 92 A92 92 0 0 1 222 150" stroke-width="6"/>
    <path d="M24 128 A104 104 0 0 1 36 92" stroke-width="3" opacity=".6"/>
  </g>

  <!-- manette -->
  <path d="M30 168 C30 134 52 116 84 116 L172 116 C204 116 226 134 226 168 L231 202
           C234 228 212 244 190 236 C175 230 166 216 152 208 L104 208 C90 216 81 230 66 236
           C44 244 22 228 25 202 Z"
        fill="url(#body)" stroke="#0b1622" stroke-width="5" stroke-linejoin="round"/>
  <path d="M44 166 C44 142 60 130 84 130 L172 130" fill="none" stroke="#ffffff" stroke-opacity=".28"
        stroke-width="4" stroke-linecap="round"/>
  <!-- croix directionnelle -->
  <path d="M72 146 h16 v14 h14 v16 h-14 v14 h-16 v-14 h-14 v-16 h14 z" fill="#0b1622"/>
  <!-- boutons -->
  <g fill="#0b1622">
    <circle cx="182" cy="146" r="9"/>
    <circle cx="200" cy="164" r="9"/>
    <circle cx="164" cy="164" r="9"/>
    <circle cx="182" cy="182" r="9"/>
  </g>

  <!-- fusée, inclinée vers le haut à droite -->
  <g transform="translate(156 96) rotate(40)">
    <path d="M-10 46 L0 78 L10 46 Z" fill="url(#flame)"/>
    <path d="M-17 18 L-32 46 L-15 42 Z" fill="#1b6bfa" stroke="#0b1622" stroke-width="4" stroke-linejoin="round"/>
    <path d="M17 18 L32 46 L15 42 Z" fill="#1b6bfa" stroke="#0b1622" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 -78 C22 -54 24 -10 17 46 L-17 46 C-24 -10 -22 -54 0 -78 Z"
          fill="url(#rocket)" stroke="#0b1622" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-6 -56 C-12 -40 -13 -14 -11 20" fill="none" stroke="#ffffff" stroke-opacity=".35"
          stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-26" r="11" fill="#0b1622"/>
    <circle cx="0" cy="-26" r="5" fill="#22b8f0" opacity=".5"/>
  </g>

  <!-- éclair qui traverse la manette -->
  <path d="M146 112 L104 170 L126 170 L96 222 L160 152 L136 152 L162 112 Z"
        fill="url(#bolt)" stroke="#0b1622" stroke-width="5" stroke-linejoin="round"/>
</svg>
